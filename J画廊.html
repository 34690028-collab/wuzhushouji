<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>AI 艺廊高级画展</title>
    <!-- 这里是第一段的开始 -->
</head>
<body>

    <!-- 1. 全屏强制加载遮罩层 -->
    <div id="loader-mask">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <div class="loader-text">系统初始化中...</div>
            <div class="loader-percentage" id="load-pct">0%</div>
        </div>
    </div>

    <!-- 2. 全局自适应容器 -->
    <div class="app-container">
        
        <!-- 3. 顶部高级导航标头 -->
        <header class="app-header">
            <button class="back-btn" onclick="handleBack()"></button>
            <div class="brand-logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">巴布曼特黑水镇福利院（BBTSWI）</span>
            </div>
            <div class="gallery-meta" id="pic-id-display">No.----</div>
        </header>

        <!-- 4. 非阻塞式游客权限提示条 -->
        <div class="visitor-toast" id="visitor-toast">
            <span class="toast-icon">⚠️</span>
            <span class="toast-text">当前为游客身份，仅解锁随机访问 8 张特权</span>
        </div>

        <!-- 5. 核心图像主展示区（支持缩放与手势） -->
        <main class="viewer-main">
            <div class="image-wrapper" id="img-wrapper">
                <img src="" alt="Gallery Image" id="gallery-target" class="gallery-img">
            </div>
        </main>

        <!-- 6. 底部流线型翻页控制器 -->
        <footer class="app-footer">
            <button class="nav-control-btn prev" id="btn-prev" onclick="navigateGallery(-1)">
                <span class="arrow">‹</span> 上一张
            </button>
            <div class="counter-display">
                <span id="current-index">1</span> <span class="divider">/</span> <span class="total-count">8</span>
            </div>
            <button class="nav-control-btn next" id="btn-next" onclick="navigateGallery(1)">
                下一张 <span class="arrow">›</span>
            </button>
        </footer>

    </div>

    <!-- HTML 结构结束，后续请拼接第二段 CSS 样式 -->
<style>
    /* ==========================================================================
       1. 全局初始化与深色主题变量
       ========================================================================== */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }
    :root {
        --bg-main: #0a0a0c;
        --bg-surface: rgba(22, 22, 26, 0.75);
        --accent-color: #d4af37; /* 高级奢华金 */
        --text-primary: #f0f0f5;
        --text-secondary: #8a8a93;
        --border-color: rgba(255, 255, 255, 0.08);
        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html, body {
        width: 100%;
        height: 100%;
        background-color: var(--bg-main);
        font-family: var(--font-stack);
        color: var(--text-primary);
        overflow: hidden; /* 禁止全屏滚动，强制应用内部流式排版 */
    }

    /* ==========================================================================
       2. 真强制限时 3 秒加载遮罩层
       ========================================================================== */
    #loader-mask {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #050507;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s;
    }
    #loader-mask.fade-out {
        opacity: 0;
        visibility: hidden;
    }
    .loader-content {
        text-align: center;
    }
    .loader-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(212, 175, 55, 0.1);
        border-top: 3px solid var(--accent-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }
    .loader-text {
        font-size: 14px;
        color: var(--text-secondary);
        letter-spacing: 2px;
        margin-bottom: 8px;
        text-transform: uppercase;
    }
    .loader-percentage {
        font-size: 28px;
        font-weight: 300;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* ==========================================================================
       3. 全屏自适应网格/弹性容器
       ========================================================================== */
    .app-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
    }
</style>
<!-- 第二段 CSS 样式（前半部分）结束，后续请拼接第三段 CSS 样式（后半部分） -->
<style>
    /* ==========================================================================
       4. 顶部高级导航标头样式（支持毛玻璃模糊效果）
       ========================================================================== */
    .app-header {
        height: 64px;
        width: 100%;
        background-color: var(--bg-surface);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        position: relative;
        z-index: 100;
    }
    .back-btn {
        width: 36px;
        height: 36px;
        background: transparent;
        border: none;
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .back-btn::before {
        content: '';
        width: 12px;
        height: 12px;
        border-left: 2px solid var(--text-primary);
        border-bottom: 2px solid var(--text-primary);
        transform: rotate(45deg);
        display: block;
    }
    .brand-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }
    .logo-icon {
        color: var(--accent-color);
        font-size: 16px;
    }
    .logo-text {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 3px;
    }
    .gallery-meta {
        font-size: 13px;
        color: var(--accent-color);
        font-family: monospace;
        background: rgba(212, 175, 55, 0.08);
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid rgba(212, 175, 55, 0.15);
    }

    /* ==========================================================================
       5. 非阻塞式游客权限提示条（从顶部丝滑滑出）
       ========================================================================== */
    .visitor-toast {
        position: absolute;
        top: -60px; /* 默认隐藏在标头上方 */
        left: 50%;
        transform: translateX(-50%);
        background: rgba(230, 70, 70, 0.95);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        z-index: 1000;
        transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none; /* 确保不挡住下方的点击操作 */
        white-space: nowrap;
    }
    .visitor-toast.show {
        top: 80px; /* 触发时向下弹出 */
    }

    /* ==========================================================================
       6. 核心图像主展示区（PC、平板、手机全自适应且允许双指/滚轮放大）
       ========================================================================== */
    .viewer-main {
        flex: 1;
        width: 100%;
        position: relative;
        overflow: hidden; /* 防止图片放大时撑破网页布局 */
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000000;
    }
    .image-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: auto; /* 当图片放大超过屏幕时允许内部拖拽滑动 */
        cursor: grab;
    }
    .image-wrapper:active {
        cursor: grabbing;
    }
    .gallery-img {
        max-width: 95%;
        max-height: 95%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        transition: transform 0.2s ease-out; /* 让放大缩小的动画更柔和 */
        transform-origin: center center;
    }

    /* ==========================================================================
       7. 底部流线型翻页控制器
       ========================================================================== */
    .app-footer {
        height: 72px;
        width: 100%;
        background-color: var(--bg-surface);
        border-top: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 100;
    }
    .nav-control-btn {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
    }
    .nav-control-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
    }
    .nav-control-btn .arrow {
        font-size: 16px;
        line-height: 1;
    }
    .counter-display {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
    }
    #current-index {
        color: var(--text-primary);
        font-weight: 700;
    }
    .divider {
        margin: 0 4px;
        opacity: 0.3;
    }

    /* 移动端特殊适配 */
    @media (max-width: 768px) {
        .app-header { padding: 0 15px; }
        .app-footer { padding: 0 16px; }
        .nav-control-btn { padding: 8px 12px; font-size: 12px; }
        .logo-text { font-size: 12px; letter-spacing: 1.5px; }
    }
</style>
<!-- 第三段 CSS 样式（后半部分）结束，后续请拼接第四段 JavaScript 数据配置与核心变量 -->
<script>
    /* ==========================================================================
       1. 核心数据源配置与海量随机编码引擎
       ========================================================================== */
    // 【重要提示】请在此处替换为您实际拥有的8张图片路径（支持本地路径或网络URL）
    const REAL_IMAGES = [
        "H画1.jpg",
        "H画2.jpg",
        "H画3.jpg",
        "H画4.jpg",
        "H画5.jpg",
        "H画6.jpg",
        "H画7.jpg",
        "H画8.jpg"
    ];

    // 全局状态管理
    let currentIndex = 0;      // 当前展示的图片索引 (0-7)
    let flipCount = 0;         // 用户总翻页点击次数计算器
    let currentScale = 1;      // 缩放比例变量
    const fakeIdPool = [];     // 伪海量编号池

    /**
     * 初始化伪海量编号生成器
     * 作用：确保玩家虽然只能看8张图，但在翻页时编码会从5690往上呈现高跨度跳跃，
     * 让玩家坚信系统内部有几千张画作，而自己只看到了其中随机解密出来的8张。
     */
    function initFakeDatabase() {
        const startNumber = 5690;
        let lastNum = startNumber;
        for (let i = 0; i < REAL_IMAGES.length; i++) {
            // 每次递增生成一个随机跨度的巨大编号（如5690 -> 6124 -> 7843）
            lastNum += Math.floor(Math.random() * 450) + 120;
            fakeIdPool.push(`No.${lastNum}`);
        }
    }

    /* ==========================================================================
       2. 强制 3 秒真假混合预加载器
       ========================================================================== */
    function startAdvancedLoader() {
        const mask = document.getElementById('loader-mask');
        const pctDisplay = document.getElementById('load-pct');
        
        let loadedCount = 0;
        let progress = 0;
        const totalImages = REAL_IMAGES.length;
        
        // 设置两道锁：1. 图片必须下载完（防止无图卡顿） 2. 计时必须满3秒（保证有缓存时的加载高级感）
        let isAssetsLoaded = false;
        let isTimeReached = false;

        // 强制3秒计时锁
        setTimeout(() => {
            isTimeReached = true;
            checkLoadingComplete();
        }, 3000);

        // 纯动画进度条平滑递增逻辑
        const timer = setInterval(() => {
            if (progress < 85) {
                progress += Math.floor(Math.random() * 4) + 1;
            } else if (isAssetsLoaded) {
                progress += 5;
            }
            if (progress >= 100) progress = 99;
            pctDisplay.innerText = progress + "%";
        }, 50);

        // 在后台通过 Image 对象静默加载这 8 张图片资源入浏览器缓存
        REAL_IMAGES.forEach((url) => {
            const img = new Image();
            img.src = url;
            img.onload = () => {
                loadedCount++;
                if (loadedCount === totalImages) {
                    isAssetsLoaded = true;
                    checkLoadingComplete();
                }
            };
            img.onerror = () => {
                // 防止因某张图片失效阻断整个网页，损坏链路时也计入完成
                loadedCount++;
                if (loadedCount === totalImages) {
                    isAssetsLoaded = true;
                    checkLoadingComplete();
                }
            };
        });

        function checkLoadingComplete() {
            if (isAssetsLoaded && isTimeReached) {
                clearInterval(timer);
                pctDisplay.innerText = "100%";
                mask.classList.add('fade-out');
                // 渲染第一张图片
                renderImage();
            }
        }
    }
</script>
<!-- 第四段结束，后续请拼接第五段 JavaScript 翻页限流与全端触控缩放核心引擎 -->
<script>
    /* ==========================================================================
       3. 核心图像渲染与高级翻页控制
       ========================================================================== */
    function renderImage() {
        const imgElement = document.getElementById('gallery-target');
        const idDisplay = document.getElementById('pic-id-display');
        const indexDisplay = document.getElementById('current-index');
        
        // 1. 重置上一次图片的缩放和位移状态，防止切新图时错位
        currentScale = 1;
        imgElement.style.transform = `scale(1)`;
        
        // 2. 注入图片地址与伪海量独一无二编码
        imgElement.src = REAL_IMAGES[currentIndex];
        idDisplay.innerText = fakeIdPool[currentIndex];
        indexDisplay.innerText = currentIndex + 1;
    }

    /**
     * 翻页核心函数
     * @param {number} direction -1 代表上一张，1 代表下一张
     */
    function navigateGallery(direction) {
        // 1. 累加用户的总翻页点击次数
        flipCount++;

        // 2. 计算新索引（在 0 到 7 之间循环流动）
        currentIndex = (currentIndex + direction + REAL_IMAGES.length) % REAL_IMAGES.length;
        
        // 3. 实时执行图像秒级渲染，确保玩家不会产生卡顿感
        renderImage();

        // 4. 【核心需求】：当总翻页数超过 8 次时，在上方滑出非阻塞式提示
        // 提示本身绝不会阻断玩家继续点击前进/后退查看这 8 张画作
        const toast = document.getElementById('visitor-toast');
        if (flipCount >= 8) {
            toast.classList.add('show');
            // 提示在滑出 3.5 秒后自动隐退，再次翻页会重新滑出提醒，完美增强仪式感
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
    }

    /* ==========================================================================
       4. 手机/平板双指多点触控与 PC 鼠标滚轮高级自适应缩放引擎
       ========================================================================== */
    function initInteractiveZoom() {
        const wrapper = document.getElementById('img-wrapper');
        const img = document.getElementById('gallery-target');
        
        let startTouchesDist = 0; // 记录双指初始距离

        // A. PC端：支持鼠标滚轮在主视区内任意放大缩小
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.08;
            if (e.deltaY < 0) {
                currentScale = Math.min(currentScale + zoomSpeed, 3.5); // 最大放大 3.5 倍
            } else {
                currentScale = Math.max(currentScale - zoomSpeed, 0.6); // 最小缩小 0.6 倍
            }
            img.style.transform = `scale(${currentScale})`;
        }, { passive: false });

        // B. 移动端/平板：支持标准的双指捏合缩放机制
        wrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // 计算两点之间的初始毕达哥拉斯几何距离
                startTouchesDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        wrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && startTouchesDist > 0) {
                // 实时计算当前双指移动过程中的最新距离
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                // 动态计算缩放因子
                const scaleFactor = currentDist / startTouchesDist;
                
                let newScale = currentScale * scaleFactor;
                if (newScale > 3.5) newScale = 3.5;
                if (newScale < 0.6) newScale = 0.6;
                
                img.style.transform = `scale(${newScale})`;
            }
        }, { passive: true });

        wrapper.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                // 当有一只手指离开屏幕时，锁定当前的缩放系数，防止突然弹回
                if(img.style.transform) {
                    const match = img.style.transform.match(/scale\(([^)]+)\)/);
                    if(match) currentScale = parseFloat(match[1]);
                }
                startTouchesDist = 0;
            }
        }, { passive: true });

        // C. 双击快速重置/放大
        wrapper.addEventListener('dblclick', () => {
            currentScale = currentScale === 1 ? 2.0 : 1;
            img.style.transform = `scale(${currentScale})`;
        });
    }

    /* ==========================================================================
       5. 顶部左侧返回键安全静默跳转（无提示）
       ========================================================================== */
    function handleBack() {
        // 遵循您的第二项指令：彻底移除任何 alert 弹窗提示，实现静默顺畅返回主页
        window.location.href = "J黑水.html"; 
    }

    // 页面完全就绪后启动所有核心引擎
    window.addEventListener('DOMContentLoaded', () => {
        initFakeDatabase();
        startAdvancedLoader();
        initInteractiveZoom();
    });
</script>
</body>
</html>
