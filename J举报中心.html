<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>解密破案系统</title>
    <style>
        /* 核心逻辑：全局强制锁定 16:9 比例响应式画布，全面兼容手机、平板、台式机 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: #1a1a1a; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #game-container { position: relative; width: 100vw; height: 56.25vw; max-width: 177.78vh; max-height: 100vh; background: #111; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 左上角返回键及返回路径预留 -->
        <!-- 左上角返回键及返回路径预留 -->
        <div id="nav-header" style="position: absolute; top: 3%; left: 2%; z-index: 10; display: flex; align-items: center; gap: 10px;">
            <!-- ⬇️ 在下方将 '你的主菜单或上一页文件名.html' 替换为你实际的网页文件名或网址 ⬇️ -->
            <a href="巴布曼特联邦警察局.html;" id="back-btn" onclick="location.href='index.html';" style="background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; text-decoration: none; font-size: 1.4vw; cursor: pointer; transition: background 0.2s;">❮ 返回</a>
            <span id="back-path" style="color: #aaa; font-size: 1.2vw; text-shadow: 1px 1px 2px #000;">当前路径: 案件侦破厅 / 线索分析仪</span>
        </div>


        <!-- 屏幕 70% 高度的核心背景与碎片展示区 -->
            <div id="evidence-area" style="position: relative; width: 100%; height: 70%; background-image: url('案件分析版.jpg'); background-size: cover; background-position: center; border-bottom: 2px solid #333;">            <!-- 5张破碎线索纸片，预留独立贴图路径与固定比例坐标 -->
            <div id="fragment-1" class="clue-fragment" style="position: absolute; top: 20%; left: 25%; width: 12%; height: 20%; background-image: url('碎片1.png'); background-size: contain; background-repeat: no-repeat; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;"></div>
            <div id="fragment-2" class="clue-fragment" style="position: absolute; top: 15%; left: 45%; width: 15%; height: 25%; background-image: url('碎片2.png'); background-size: contain; background-repeat: no-repeat; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;"></div>
            <div id="fragment-3" class="clue-fragment" style="position: absolute; top: 45%; left: 25%; width: 14%; height: 22%; background-image: url('碎片3.png'); background-size: contain; background-repeat: no-repeat; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;"></div>
            <div id="fragment-4" class="clue-fragment" style="position: absolute; top: 40%; left: 65%; width: 13%; height: 24%; background-image: url('碎片4.png'); background-size: contain; background-repeat: no-repeat; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;"></div>
            <div id="fragment-5" class="clue-fragment" style="position: absolute; top: 25%; left: 38%; width: 11%; height: 18%; background-image: url('碎片5.png'); background-size: contain; background-repeat: no-repeat; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;"></div>
        </div>
        <!-- 下方 30% 对话与交互输入栏 -->
        <div id="dialogue-area" style="width: 100%; height: 30%; background: #222; display: flex; padding: 1.5%; gap: 1.5%;">
            <!-- 对方头像预留路径 -->
            <div id="avatar-box" style="width: 10%; height: 100%; background-image: url('5接警.png'); background-size: cover; background-position: center; border-radius: 6px; border: 2px solid #444; flex-shrink: 0;"></div>
            
            <!-- 对话核心内容显示区 -->
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <div id="chat-bubble" style="color: #ddd; font-size: 1.4vw; line-height: 1.5; background: #2a2a2a; padding: 10px 15px; border-radius: 6px; height: 65%; overflow-y: auto;">
                    加载中...
                </div>
                <!-- 玩家文本输入交互行 -->
                <div style="display: flex; gap: 10px; height: 30%;">
                    <input type="text" id="player-input" placeholder="请输入线索编号（如 AAA***）..." style="flex-grow: 1; background: #111; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 0 10px; font-size: 1.2vw;">
                    <button id="submit-btn" onclick="handleClueSubmit()" style="background: #a91e23; color: #fff; border: none; padding: 0 20px; border-radius: 4px; font-size: 1.2vw; cursor: pointer;">提交</button>
                </div>
            </div>
        </div>
        <!-- 5张碎片全部解锁后的结案弹窗（已加入返回上一步功能） -->
        <div id="case-modal" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100;">
            <div style="background: #2c2c2c; border: 2px solid #a91e23; border-radius: 8px; width: 45%; padding: 4%; text-align: center; box-shadow: 0 0 20px rgba(169,30,35,0.5);">
                <h2 style="color: #a91e23; font-size: 2.2vw; margin-bottom: 1.5vw; letter-spacing: 2px;">⚠️ 案件真相大白</h2>
                <p style="color: #ccc; font-size: 1.3vw; margin-bottom: 2.5vw; line-height: 1.6;">所有证据链已经完整，我们即刻出动警力将它们一网打尽。</p>
                
                <!-- 交互按钮组 -->
                <div style="display: flex; justify-content: center; gap: 20px;">
                    <!-- 返回上一步按钮：隐藏弹窗 -->
                    <button onclick="document.getElementById('case-modal').style.display = 'none';" style="background: #444; color: #fff; border: 1px solid #666; padding: 10px 24px; font-size: 1.2vw; border-radius: 4px; cursor: pointer; transition: background 0.2s;">返回上一步</button>
                    <!-- 前往破案按钮 -->
                    <button onclick="location.href='path/to/solved_page.html';" style="background: #a91e23; color: #fff; border: none; padding: 10px 24px; font-size: 1.2vw; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s;">点击跳转结局</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 线索核心底层字典定义（您可以根据需要任意增删和修改特定编号）
        const CLUE_DB = {
            "EPT999": { id: 1, info: "【线索1】恭喜你收集到了空间实验室骇人实验的物证。" },
            "EPT789": { id: 2, info: "【线索2】黑水镇这家的福利院问题太多，虚假的捐赠账目和大量人口失踪幕后都指向它。这些证据很关键；谢谢你的提供。" },
            "EPT233": { id: 3, info: "【线索3】这是诺凡泰克的实验室伊特尼塔计划核心秘密，虽然不全，但这些也足以撕开它的面具，为我们后续调查起到关键作用。" },
            "EPT760": { id: 4, info: "【线索4】监控证据显示，艾琳·索恩的死亡不是普通的交通事故，而是有人蓄意谋杀，我们已经锁定证据，即刻对他进行逮捕。" },
            "EPT563": { id: 5, info: "【线索5】赖小花记者被抓关押的地方已经确定，已经派遣特种战术部队前往救援，感谢你的帮助。" }
        };

        // 初始化玩家状态变量
        let gameState = {
            unlockedFragments: [], // 存储已解锁的碎片ID数组
            currentNpcText: "请问有什么新线索可以提供？"
        };
    </script>
    <script>
        // 从 localStorage 恢复或初始化缓存，保证流程万无一失
        function initGameState() {
            const cached = localStorage.getItem("detective_game_cache");
            if (cached) {
                try {
                    gameState = JSON.parse(cached);
                } catch(e) {
                    console.error("缓存数据解析失败，已自动重置");
                }
            }
            renderUiByState();
        }

        // 根据最新状态数据渲染 UI 节点
        function renderUiByState() {
            // 恢复所有已解锁线索碎片的可见度
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`fragment-${i}`).style.opacity = "0";
            }
            gameState.unlockedFragments.forEach(fragmentId => {
                const el = document.getElementById(`fragment-${fragmentId}`);
                if (el) el.style.opacity = "1";
            });

            // 动态输出当前的对话气泡文本
            document.getElementById("chat-bubble").innerHTML = gameState.currentNpcText;

            // 检查五张纸片是否全部集齐，触发案件完结弹窗
            if (gameState.unlockedFragments.length === 5) {
                setTimeout(() => {
                    document.getElementById("case-modal").style.display = "flex";
                }, 600);
            } else {
                document.getElementById("case-modal").style.display = "none";
            }
        }

        // 保存当前状态至浏览器本地缓存
        function saveToCache() {
            localStorage.setItem("detective_game_cache", JSON.stringify(gameState));
        }
    </script>
    <script>
        // 处理玩家线索输入的主控制流
        function handleClueSubmit() {
            const inputEl = document.getElementById("player-input");
            const rawVal = inputEl.value.trim();
            inputEl.value = ""; // 提交后清空输入框

            if (!rawVal) return;

            // 触发高级开发者重置指令：开发者还原
            if (rawVal === "开发者还原") {
                gameState.unlockedFragments = [];
                gameState.currentNpcText = "请问有什么新线索可以提供？";
                saveToCache();
                renderUiByState();
                return;
            }

            // 比对线索库核心匹配
            if (CLUE_DB[rawVal]) {
                const item = CLUE_DB[rawVal];
                if (!gameState.unlockedFragments.includes(item.id)) {
                    gameState.unlockedFragments.push(item.id);
                }
                gameState.currentNpcText = `【线索价值分析】匹配成功！<br>${item.info}`;
            } else {
                // 输错编号时的反向回馈提示
                gameState.currentNpcText = `【线索错误】警员，你提交的线索编号 "${rawVal}" 查无此项，虚假报案我们可能会起诉你哦。`;
            }

            saveToCache();
            renderUiByState();
        }

        // 监听回车键快捷提交输入
        document.getElementById("player-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") handleClueSubmit();
        });

        // 页面就绪后立即执行初始化加载
        window.onload = initGameState;
    </script>
</body>
</html>
