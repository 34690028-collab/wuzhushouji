    <style>
                /* 全局高平滑自适应基础重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden; /* 杜绝横向滚动条Bug */
            background: #ffffff;
            color: #202124;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
        }

        /* 顶部导航：使用标准无错位流式布局 */
        .top-nav {
            width: 100%;
            min-height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 13px;
            flex-shrink: 0; /* 画面缩放时防止顶栏被压扁 */
        }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-link { color: rgba(0,0,0,0.87); text-decoration: none; white-space: nowrap; }
        .nav-link:hover { text-decoration: underline; }
        
        .apps-icon {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; fill: #5f6368; flex-shrink: 0;
        }
        .apps-icon:hover { background: #f1f3f4; }
        .apps-icon svg { width: 24px; height: 24px; }

        /* 右上角账户区域：增强版流式包裹防换行错位 */
        .user-control-group {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .user-avatar {
            min-width: 34px; height: 34px; padding: 0 12px;
            background: #e8eaed; border-radius: 17px;
            display: flex; justify-content: center; align-items: center;
            font-size: 13px; font-weight: bold; color: #5f6368;
            cursor: pointer; user-select: none; transition: all 0.2s;
            border: 1px solid transparent; white-space: nowrap;
        }
        .user-avatar:hover { background: #d2d6dc; color: #1a73e8; }
        
        /* 独立注销按钮样式（修正了触摸点Bug） */
        .logout-icon {
            display: none; width: 34px; height: 34px; border-radius: 50%;
            justify-content: center; align-items: center;
            cursor: pointer; fill: #da362d; transition: background 0.2s; flex-shrink: 0;
        }
        .logout-icon:hover { background: #fce8e6; }
        .logout-icon svg { width: 20px; height: 20px; pointer-events: none; } /* 确保精确捕获点击 */
        /* 主体布局：采用流式弹性高度，自适应任何屏幕尺寸 */
        .main-container {
            flex: 1; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            width: 100%; 
            max-width: 584px; 
            padding: 0 20px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* 复合式一体化 Logo 盒子：比例锁定，杜绝形变 */
        .logo-box {
            position: relative;
            height: 110px; 
            margin-bottom: 24px;
            display: flex; justify-content: center; align-items: flex-end;
            padding-left: 24px; 
            flex-shrink: 0;
        }

        /* 左上角贴图：采用绝对定位锁定在浮动的Logo父容器内部，实现永不脱轨的平移 */
        .logo-icon-badge {
            position: absolute;
            top: 4px; 
            left: -12px;
            width: 72px;
            height: 72px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.85;
        }
        .logo-icon-badge img {
            width: 100%; height: 100%; object-fit: contain;
        }

        /* 彩色文本 */
        .logo-text { font-size: 46px; font-weight: bold; letter-spacing: -1.5px; user-select: none; white-space: nowrap; }
        .logo-text .g1 { color: #4285F4; }
        .logo-text .o1 { color: #EA4335; }
        .logo-text .o2 { color: #FBBC05; }
        .logo-text .g2 { color: #4285F4; }
        .logo-text .l  { color: #34A853; }
        .logo-text .e  { color: #EA4335; }


        /* 搜索框：自适应宽度且自带防横向溢出 */
        .search-wrapper { width: 100%; max-width: 100%; margin-bottom: 18px; box-sizing: border-box; }
        .search-box {
            width: 100%; height: 46px; background: #fff;
            border: 1px solid #dfe1e5; border-radius: 24px;
            display: flex; align-items: center; padding: 0 14px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }
        .search-input {
            flex: 1; height: 100%; border: none; outline: none;
            padding: 0 10px; font-size: 16px; color: #202124; min-width: 0; /* 核心修复：防止input在弹性盒内撑开容器 */
        }
        .icon-search, .icon-mic, .icon-lens { width: 20px; height: 20px; flex-shrink: 0; }
        .icon-search { fill: #9aa0a6; }
        .search-tools { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        .icon-mic, .icon-lens { fill: #4285f4; cursor: pointer; }

        /* 搜索按钮 */
        .btn-group { margin-top: 18px; display: flex; gap: 12px; flex-shrink: 0; }
        .google-btn {
            background-color: #f8f9fa; border: 1px solid #f8f9fa;
            border-radius: 4px; color: #3c4043; font-size: 14px;
            padding: 0 16px; line-height: 36px; min-width: 96px;
            text-align: center; cursor: pointer; outline: none;
        }
        .google-btn:hover { border: 1px solid #dadce0; color: #202124; background: #f1f3f4; }

        /* 全体复合一键呼吸动效 */
        .logo-box { animation: floatUpDown 4.5s ease-in-out infinite; }
        @keyframes floatUpDown {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-7px); } 
            100% { transform: translateY(0px); }
        }

        /* 修复：将固定定位（Fixed）的弹窗层级调至最高，确保任何尺寸都能居中且可以有效抓取点击 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            justify-content: center; align-items: center; z-index: 99999;
            padding: 16px; box-sizing: border-box;
        }
        .modal-box {
            background: white; padding: 24px; border-radius: 8px;
            width: 100%; max-width: 440px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            box-sizing: border-box; overflow: hidden;
        }
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; color: #202124; }
        
        .modal-footer-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; flex-wrap: wrap; gap: 12px; width: 100%;
        }
        .login-left-brand { font-size: 12px; color: #9aa0a6; font-family: monospace; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btn { padding: 8px 16px; border-radius: 4px; border: none; font-size: 14px; cursor: pointer; }
        .modal-btn.confirm { background: #1a73e8; color: white; }
        .modal-btn.cancel { background: transparent; color: #5f6368; }
        .login-form { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .login-input { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 4px; outline: none; font-size: 14px; }

        /* 响应式多端无缝纠错断点 */
        .footer { width: 100%; background: #f2f2f2; font-size: 14px; color: #70757a; flex-shrink: 0; }
        .footer-top { padding: 15px 30px; border-bottom: 1px solid #e4e4e4; }
        .footer-bottom { padding: 15px 30px; display: flex; justify-content: space-between; }
        .footer-left, .footer-right { display: flex; gap: 27px; }
        .footer-bottom a { color: #70757a; text-decoration: none; }

        @media (max-width: 600px) {
            .top-nav { padding: 0 16px; min-height: 50px; }
            .nav-left, .apps-icon { display: none !important; } /* 移动端屏蔽非必要干扰元素 */
            .main-container { justify-content: center; padding: 0 16px; margin-top: -20px; }
            .logo-box { height: 70px; margin-bottom: 16px; padding-left: 15px; }
            .logo-text { font-size: 34px; }
            .logo-icon-badge { width: 24px; height: 24px; top: 2px; left: -10px; }
            .btn-group { display: none !important; } /* 移动端完全隐藏中间宽按钮 */
            .modal-box { padding: 20px; }
            .modal-footer-row { flex-direction: column-reverse; align-items: flex-start; gap: 16px; }
            .modal-buttons { width: 100%; justify-content: flex-end; }
            .footer-bottom { flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
            .footer-left, .footer-right { gap: 16px; font-size: 12px; justify-content: center; flex-wrap: wrap; }
        }
    </style>

                console.log("%c【开发者提示】: 代码层无明文可绕过。请回到前端执行推理解密。", "color: #4285F4; font-size: 12px; line-height: 1.5;");
                console.log("%c========================================================", "color: #5f6368;");
            }, 1000);
        })();


        // ==========================================
        // 基础交互控制器（增加事件防御）
        // ==========================================
        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { executeSearch(); }
        });

        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            if (VALID_SEARCHES.hasOwnProperty(query)) {
                window.location.href = VALID_SEARCHES[query];
            } else {
                showAlert("系统提醒", ERROR_TIP);
            }
        }

        function showAlert(title, text) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertText').innerText = text;
            document.getElementById('alertModal').style.display = 'flex';
        }
        function closeAlert() { document.getElementById('alertModal').style.display = 'none'; }

        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('username').focus();
        }
        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }

        function submitLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if (ADMIN_ACCOUNTS.hasOwnProperty(u) && ADMIN_ACCOUNTS[u].password === p) {
                localStorage.setItem('Hymmingbird_Logged_In_User', u);
                closeLoginModal();
                checkLoginState();
                window.location.href = ADMIN_ACCOUNTS[u].targetUrl;
            } else {
                alert("账号或密码错误，请重新尝试。");
                closeLoginModal();
            }
        }
    </script>
