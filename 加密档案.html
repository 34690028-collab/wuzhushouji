<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式云盘档案系统 - 竖版9:16</title>
    <style>
        /* 全局基础重置与响应式 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; }
        
        /* 全局顶部返回键 */
        .global-back-btn { position: fixed; top: 20px; left: 20px; padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; z-index: 100; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .global-back-btn:hover { background: rgba(255,255,255,0.2); transform: translateX(-3px); }

        /* 视图面板容器 */
        .view-panel { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: none; align-items: center; justify-content: center; flex-direction: column; overflow: hidden; }
        .view-panel.active { display: flex; }

        /* 登录卡片布局 */
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; }
        .login-card h2 { margin-bottom: 24px; font-weight: 600; color: #38bdf8; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        .input-group input { width: 100%; padding: 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 16px; outline: none; transition: all 0.3s; }
        .input-group input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #38bdf8, #0284c7); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .error-msg { color: #f43f5e; font-size: 14px; margin-top: 12px; min-height: 20px; }
        /* 真实加载动画页面 */
        .loader-container { text-align: center; }
        .spinner { width: 60px; height: 60px; border: 5px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        .progress-text { font-size: 18px; color: #94a3b8; font-weight: 500; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 三维仿纸翻页舞台 - 固定9:16竖版比例容器 */
        .archive-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 20px; }
        .book-stage { position: relative; width: 90%; max-width: 520px; aspect-ratio: 9/16; perspective: 1500px; -webkit-perspective: 1500px; margin-bottom: 24px; }
        .page { position: absolute; width: 100%; height: 100%; top: 0; left: 0; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transform-origin: left center; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); cursor: grab; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .page:active { cursor: grabbing; }
        .page img { width: 100%; height: 100%; object-fit: contain; object-position: center; background: #0f172a; pointer-events: none; }
        .page::after { content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.6s; backface-visibility: hidden; -webkit-backface-visibility: hidden; pointer-events: none; }
        .page.flipped { transform: rotateY(-145deg) scale(0.95); z-index: 10 !important; }
        .page.flipped::after { opacity: 0.4; }

        /* 备份组件与弹窗 */
        .backup-btn-container { width: 100%; text-align: center; z-index: 20; }
        .backup-btn { padding: 14px 32px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .backup-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .modal-card h3 { margin-bottom: 16px; color: #10b981; }
        .code-box { background: #0f172a; border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 10px; font-family: monospace; font-size: 14px; color: #34d399; word-break: break-all; max-height: 120px; overflow-y: auto; text-align: left; margin-bottom: 20px; white-space: pre-wrap; }
        .close-modal-btn { width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: none; border-radius: 10px; color: #fff; font-size: 14px; cursor: pointer; transition: background 0.3s; }
        .close-modal-btn:hover { background: rgba(255,255,255,0.2); }

        @media (max-width: 768px) { 
            .book-stage { width: 92vw; max-width: 92vw; } 
            .login-card { padding: 30px 20px; } 
            .global-back-btn { top: 12px; left: 12px; padding: 8px 14px; font-size: 13px; }
        }
        @media (min-width: 1200px) {
            .book-stage { max-width: 640px; } /* 竖版大屏适配，调整为更合理的最大宽度 */
        }
    </style>
</head>
<body>

    <!-- 登录界面 -->
    <div id="loginView" class="view-panel active">
        <button class="global-back-btn" onclick="alert('已经是登录页')">← 退出</button>
        <div class="login-card">
            <h2>网络云盘登录</h2>
            <div class="input-group">
                <label for="username">账号</label>
                <input type="text" id="username" placeholder="请输入任意账号" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码 (123456)">
            </div>
            <button class="login-btn" onclick="handleLogin()">立即登录</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>
    <!-- 加载动画界面 -->
    <div id="loadingView" class="view-panel">
        <button class="global-back-btn" onclick="resetToLogin()">← 取消加载</button>
        <div class="loader-container">
            <div class="spinner"></div>
            <div id="progressText" class="progress-text">系统解密中... 0%</div>
        </div>
    </div>

    <!-- 仿真档案内容界面 -->
    <div id="archiveView" class="view-panel">
        <button class="global-back-btn" onclick="resetToLogin()">← 退出档案</button>
        
        <div class="archive-wrapper">
            <!-- 三维翻页舞台 -->
            <div id="bookStage" class="book-stage">
                <!-- 预留的5张贴图路径 -->
                <div class="page" style="z-index: 5;">
                    <img src="机密1.jpg" alt="档案第1页">
                </div>
                <div class="page" style="z-index: 4;">
                    <img src="机密2.jpg" alt="档案第2页">
                </div>
                <div class="page" style="z-index: 3;">
                    <img src="机密3.jpg" alt="档案第3页">
                </div>
                <div class="page" style="z-index: 2;">
                    <img src="机密4.jpg" alt="档案第4页">
                </div>
                <div class="page" style="z-index: 1;">
                    <img src="机密5.jpg" alt="档案第5页">
                </div>
            </div>

            <!-- 底部固定保留的一键备份按钮 -->
            <div class="backup-btn-container">
                <button class="backup-btn" onclick="triggerBackup()">一键备份核心数据</button>
            </div>
        </div>
    </div>

    <!-- 备份编码弹窗 -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <h3>🔒 备份数据已加密生成</h3>
            <div id="codeBox" class="code-box"></div>
            <button class="close-modal-btn" onclick="closeModal()">确认并关闭</button>
        </div>
    </div>
    <script>
        // 1. 系统配置
        const TARGET_PASSWORD = "1"; 
        let imagesLoadedCount = 0;        
        const totalImages = 5;            
        let isImageLoadingStarted = false; 

        const loginView = document.getElementById('loginView');
        const loadingView = document.getElementById('loadingView');
        const archiveView = document.getElementById('archiveView');
        const progressText = document.getElementById('progressText');
        const errorMsg = document.getElementById('errorMsg');

        // 2. 登录验证控制
        function handleLogin() {
            const passInput = document.getElementById('password').value;
            errorMsg.innerText = "";

            if (passInput === TARGET_PASSWORD) {
                switchView(loadingView);
                startRealImageLoading();
            } else {
                errorMsg.innerText = "密码错误，请重新输入！";
            }
        }

        // 3. 5张图片真实下载网速测速加载逻辑
        function startRealImageLoading() {
            if (isImageLoadingStarted) return; 
            isImageLoadingStarted = true;
            imagesLoadedCount = 0;
            updateProgressDisplay(0);

            const imgElements = document.querySelectorAll('#bookStage .page img');
            
            imgElements.forEach((img) => {
                const fakeImg = new Image();
                
                fakeImg.onload = fakeImg.onerror = () => {
                    imagesLoadedCount++;
                    let progressPercent = Math.floor((imagesLoadedCount / totalImages) * 100);
                    updateProgressDisplay(progressPercent);

                    if (imagesLoadedCount >= totalImages) {
                        setTimeout(() => {
                            switchView(archiveView);
                            initFlipFeature(); 
                        }, 400); 
                    }
                };
                fakeImg.src = img.src;
            });
        }

        function updateProgressDisplay(percent) {
            progressText.innerText = `数据解密中... ${percent}%`;
        }

        function switchView(targetView) {
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
            targetView.classList.add('active');
        }
        // 4. 全局返回与重置逻辑
        function resetToLogin() {
            document.getElementById('password').value = "";
            errorMsg.innerText = "";
            isImageLoadingStarted = false;
            
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('flipped');
            });
            switchView(loginView);
        }

        // 5. 鼠标拖拽/手机触控双端兼容的仿真反纸页核心算法
        function initFlipFeature() {
            const pages = Array.from(document.querySelectorAll('.page'));
            let startX = 0;
            let currentX = 0;
            let isDragging = false;
            let activePage = null;

            function getTopVisiblePage() {
                return pages.find(page => !page.classList.contains('flipped'));
            }

            function getTopFlippedPage() {
                const flippedPages = pages.filter(page => page.classList.contains('flipped'));
                return flippedPages.length > 0 ? flippedPages[flippedPages.length - 1] : null;
            }

            function dragStart(e) {
                isDragging = true;
                const touch = e.type.includes('touch') ? e.touches : e;
                startX = touch.clientX;
                currentX = startX; 
            }

            function dragMove(e) {
                if (!isDragging) return;
                const touch = e.type.includes('touch') ? e.touches : e;
                currentX = touch.clientX;
            }

            function dragEnd(e) {
                if (!isDragging) return;
                isDragging = false;

                const deltaX = currentX - startX;
                const swipeThreshold = 50; 

                if (Math.abs(deltaX) > swipeThreshold && currentX !== 0) {
                    if (deltaX < 0) {
                        activePage = getTopVisiblePage();
                        if (activePage) {
                            activePage.classList.add('flipped');
                        }
                    } else {
                        activePage = getTopFlippedPage();
                        if (activePage) {
                            activePage.classList.remove('flipped');
                        }
                    }
                }
                startX = 0;
                currentX = 0;
            }

            const stage = document.getElementById('bookStage');
            
            // 鼠标事件兼容
            stage.addEventListener('mousedown', dragStart);
            window.addEventListener('mousemove', dragMove);
            window.addEventListener('mouseup', dragEnd);

            // 移动/平板触控事件兼容
            stage.addEventListener('touchstart', dragStart, { passive: true });
            stage.addEventListener('touchmove', dragMove, { passive: true });
            stage.addEventListener('touchend', dragEnd);
        }

        // 6. 一键备份核心数据按钮逻辑
        function triggerBackup() {
            const timestamp = new Date().getTime();
            const randomHex = Math.random().toString(16).substring(2, 10).toUpperCase();
            const mockCode = `BAK-CLOUD-${randomHex}-${timestamp}\nSYS-INTEGRITY: SUCCESS\nBLOCK-VERIFY: OK\nMD5: ${Math.random().toString(36).substring(2, 15)}`;
            
            document.getElementById('codeBox').innerText = mockCode;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
