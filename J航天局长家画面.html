/* =========================

   红外模式
========================= */


/* 夜间摄像头画面 */
body.night-mode .cctv-feed {

    filter:
    brightness(0.55)
    contrast(1.3)
    saturate(0.35)
    hue-rotate(65deg);

}


/* 夜间时间戳 */
body.night-mode .live-timestamp,
body.night-mode .channel-name {

    color:#00ff66;

    text-shadow:
    0 0 6px #00ff66,
    1px 1px 3px #000;

}



/* 红外扫描线 */
body.night-mode .cctv-channel::after {

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

    repeating-linear-gradient(
        0deg,
        rgba(0,255,100,0.08) 0px,
        rgba(0,255,100,0.08) 1px,
        transparent 2px,
        transparent 4px
    );


    z-index:7;

}



/* CCD摄像头噪点 */
body.night-mode .cctv-channel::before {

    content:"";

    position:absolute;

    inset:0;


    background-image:url("noise.png");


    opacity:0.12;


    pointer-events:none;


    animation:
    noiseMove .15s infinite;


    z-index:6;

}



@keyframes noiseMove {


    0%{
        transform:translate(0,0);
    }


    25%{
        transform:translate(-2px,1px);
    }


    50%{
        transform:translate(2px,-1px);
    }


    75%{
        transform:translate(1px,2px);
    }


    100%{
        transform:translate(0,0);
    }

}



/* 隐藏测试点击区域 */
#secretSwitch{

    cursor:pointer;

            position: absolute;

<script>
    // ================================
// 蜂鸟科技监控昼夜系统
// ================================

let debugNightMode = false;


// 自动昼夜切换
function updateCctvTimeMode(){


    // 如果开启隐藏测试，则跳过自动时间

    if(debugNightMode){
        return;
    }


    const hour = new Date().getHours();


    const isDay = hour >= 6 && hour < 18;



    document.querySelectorAll(".cctv-feed").forEach(img=>{


        if(isDay){

            img.src = img.dataset.day;

        }else{

            img.src = img.dataset.night;

        }


    });



    if(isDay){

        document.body.classList.remove("night-mode");

    }else{

        document.body.classList.add("night-mode");

    }

}



// 强制夜间测试

function enableNightTest(){


    debugNightMode = true;


    document.body.classList.add("night-mode");



    document.querySelectorAll(".cctv-feed").forEach(img=>{

        img.src = img.dataset.night;

    });


}



// 强制白天测试

function enableDayTest(){


    debugNightMode = true;


    document.body.classList.remove("night-mode");



    document.querySelectorAll(".cctv-feed").forEach(img=>{

        img.src = img.dataset.day;

    });


}
// ================================
// 隐藏开发者模式
// 标题点击10次切换昼夜
// ================================


let secretClickCount = 0;

let secretTimer = null;



document.addEventListener("DOMContentLoaded",()=>{


    const secret = document.getElementById("secretSwitch");



    if(!secret) return;



    secret.addEventListener("click",()=>{


        secretClickCount++;



        clearTimeout(secretTimer);



        secretTimer=setTimeout(()=>{

            secretClickCount=0;

        },2000);




        if(secretClickCount>=10){


            secretClickCount=0;



            if(document.body.classList.contains("night-mode")){


                enableDayTest();


                showSecretMessage(
                "☀ DAY CAMERA SYSTEM ONLINE"
                );


            }else{


                enableNightTest();


                showSecretMessage(
                "🌙 NIGHT VISION SYSTEM ONLINE"
                );


            }


        }



    });



});




//隐藏提示

function showSecretMessage(text){


    const tip=document.createElement("div");


    tip.innerHTML=text;


    tip.style.cssText=
    `
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.85);
    color:#00ff66;
    padding:20px 30px;
    border:1px solid #00ff66;
    border-radius:6px;
    font-family:monospace;
    z-index:99999;
    letter-spacing:2px;
    `;



    document.body.appendChild(tip);



    setTimeout(()=>{

        tip.remove();

    },1200);


}
    // 1. 【高精密时钟】：驱动4路监控表面的年/月/日 时:分:秒.毫秒(MS)飞速狂飙
    function startCctvClock() {
        const channels = ["time-ch1", "time-ch2", "time-ch3", "time-ch4"];
        
        // 40毫秒超高频刷新率，确保3位毫秒跳动丝滑流畅，绝不重影与闪屏
        setInterval(() => {
            const now = new Date();
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
            
            const timestampString = `${year}/${month}/${date} ${hours}:${minutes}:${seconds}.${milliseconds}`;
            
            channels.forEach(id => {
                const element = document.getElementById(id);
                if (element) element.textContent = timestampString;
            });
        }, 40); 
    }

    // 2. 核心互锁全屏放大缩小引擎（结合全幅右侧50%触控板修正）
    function toggleExpand(channelElement, event) {
        // 关键逻辑：如果点击的是右侧50%剧情触发器，且正处于全屏状态，直接由剧情函数拦截，不在此执行缩小
        if (event && event.target.classList.contains("cctv-hotspot") && channelElement.classList.contains("expanded")) return;

        const isExpanded = channelElement.classList.contains("expanded");
        if (isExpanded) {
            channelElement.classList.remove("expanded");
        } else {
            document.querySelectorAll(".cctv-channel").forEach(el => el.classList.remove("expanded"));
            channelElement.classList.add("expanded");
        }
    }

// 3. 【剧情一】：监控 1 画面解锁汽车（手机友好版，不再触发系统“关闭网页”提示）
function clickCar(event) {
    event.stopPropagation(); // 强行切断信号扩散
    
    // 1. 创建一个完全由前端控制的漂亮对话框，绕过手机浏览器底层的 confirm
    const mask = document.createElement('div');
    mask.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:monospace;";
    
    const dialog = document.createElement('div');

// ================================
// 自动昼夜监控贴图切换
// 06:00 - 18:00 白天
// 18:00 - 06:00 夜晚
// ================================
function updateCctvTimeMode(){

    const hour = new Date().getHours();

    const isDay = hour >= 6 && hour < 18;


    document.querySelectorAll(".cctv-feed").forEach(img=>{


        if(isDay){

            img.src = img.dataset.day;


        }else{


            img.src = img.dataset.night;


        }


    });



    //切换整个监控系统模式

    if(isDay){

        document.body.classList.remove("night-mode");

    }else{

        document.body.classList.add("night-mode");

    }

}
