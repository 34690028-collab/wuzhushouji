<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>推理解谜游戏《无主机主》</title>
    <style>
                /* ==================== 1. 全局清除与手机外壳 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            overflow: hidden;
        }

        .phone-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 430px;   
            max-height: 932px;  
            background: #000000;
            border-radius: 45px;
            border: 12px solid #2c2c2e; 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* 🔴 预留壁纸层：严格死锁尺寸，不加毛玻璃。图片由后面的第4段JS动态赋值控制 */
        .phone-wallpaper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.2s ease-in-out;
        }

        /* 🔴 UI内容层 */
        .phone-ui-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 20px 30px 20px;
        }

        /* ==================== 2. 仿真状态栏（无胶囊摄像头） ==================== */
        .status-bar {
            height: 34px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 0 8px;
            width: 100%;
        }

        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 11px;
        }

        .bar {
            width: 3px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 1px;
        }

        .bar:nth-child(1) { height: 30%; background-color: #fff; }
        .bar:nth-child(2) { height: 50%; background-color: #fff; }
        .bar:nth-child(3) { height: 75%; background-color: #fff; }
        .bar:nth-child(4) { height: 100%; background-color: #fff; }

        .battery-outer {
            width: 24px;
            height: 12px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 3.5px;
            padding: 1px;
            position: relative;
        }

        .battery-outer::after {
            content: '';
            position: absolute;
            right: -3.5px;
            top: 3.5px;
            width: 1.5px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 0 1px 1px 0;
        }

        .battery-core {
            height: 100%;
            background-color: #fff;
            border-radius: 1.5px;
            width: 85%;
        }
        /* ==================== 3. 桌面网格与APP图标样式 ==================== */
        .app-grid {
            flex: 1;
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: min-content;
            gap: 24px 16px;
            padding: 10px 4px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        /* APP 图标外壳容器 */
        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, filter 0.1s ease;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .app-item:active .app-icon {
            transform: scale(0.92);
            filter: brightness(0.85);
        }

        .app-name {
            margin-top: 6px;
            font-size: 11px;
            color: #ffffff;
            text-align: center;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            white-space: nowrap;
        }

        /* 底部固定 Dock 栏 */
        .dock-bar {
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            width: 100%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .dock-bar .app-icon { width: 56px; height: 56px; }

        @media (max-width: 450px) {
            body { background-color: #000000; }
            .phone-wrapper { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border: none; border-radius: 0; }
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <!-- 壁纸层 -->
        <div class="phone-wallpaper" id="phoneWallpaper"></div>
        
        <div class="phone-ui-content">
            
            <!-- 仿真状态栏 -->
            <div class="status-bar">
                <div class="status-left">
                    <span class="carrier">中联移动</span>
                    <div class="signal-bars">
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
                    </div>
                </div>
                <div class="status-center"></div>
                <div class="status-right">
                    <span id="statusBarTime">00:00</span>
                    <div class="battery-outer"><div class="battery-core"></div></div>
                </div>
            </div>

            <!-- 📱 桌面网格应用区域（已经开放跳转！只需把 href="这里" 换成你的网址） -->
            <div class="app-grid">
                <!-- 1. 备忘录 -->
                <a href="备忘录.html" class="app-item" data-name="备忘录">
                    <div class="app-icon"><img src="02备忘录.png" alt="备忘录"></div>
                    <div class="app-name">备忘录</div>
                </a>
                <!-- 2. 微信 -->
                <a href="J微讯.html" class="app-item" data-name="微讯">
                    <div class="app-icon"><img src="02微讯.png" alt="微讯"></div>
                    <div class="app-name">微讯</div>
                </a>
                <!-- 3. 相册 -->
                <a href="相册.html" class="app-item" data-name="相册">
                    <div class="app-icon"><img src="02相册.png" alt="相册"></div>
                    <div class="app-name">相册</div>
                </a>
                <!-- 4. 浏览器 -->
                <a href="浏览器.html" class="app-item" data-name="浏览器">
                    <div class="app-icon"><img src="02浏览器.png" alt="浏览器"></div>
                    <div class="app-name">浏览器</div>
                </a>
                <!-- 5. 录音机 -->
                <a href="录音机.html" class="app-item" data-name="录音机">
                    <div class="app-icon"><img src="02录音机.png" alt="录音机"></div>
                    <div class="app-name">录音机</div>
                </a>
                <!-- 6. Email -->
                <a href="mail.html" class="app-item" data-name="Email">
                    <div class="app-icon"><img src="02邮箱.png" alt="Email"></div>
                    <div class="app-name">Email</div>
                </a>
                <!-- 7. 设置 -->
                <a href="javascript:void(0);" class="app-item" data-name="设置">
                    <div class="app-icon"><img src="02设置.png" alt="设置"></div>
                    <div class="app-name">设置</div>
                </a>
            </div>

            <!-- 📱 底部常驻栏四大金刚（已开放跳转！默认预留了示例网址） -->
            <div class="dock-bar">
                <!-- 8. 电话 -->
                <a href="拨号.html" class="app-item" data-name="Email">
                    <div class="app-icon"><img src="02电话.png" alt="电话"></div>
                    <div class="app-name">电话</div>
                </a>
                <!-- 9. 地图 -->
                <a href="javascript:void(0);" class="app-item" data-name="地图">
                    <div class="app-icon"><img src="02地图.png" alt="地图"></div>
                    <div class="app-name">地图</div>
                </a>
                <!-- 10. 短信 -->
                <a href="javascript:void(0);" class="app-item" data-name="短信">
                    <div class="app-icon"><img src="02短信.png" alt="短信"></div>
                    <div class="app-name">短信</div>
                </a>
                <!-- 11. 音乐 -->
                <a href="MP3.html" classclass="app-item" data-name="音乐">
                    <div class="app-icon"><img src="02音乐.png" alt="音乐"></div>
                    <div class="app-name">音乐</div>
                </a>
            </div>

        </div>
    </div>
    <script>
   
        // ==================== 1. 自定义配置项 ====================
        // 🎵 全局桌面触摸音效链接
        const TOUCH_SOUND_URL = "手机按键音.AAC";

        // 🔴 5 个循环切换的壁纸链接
        const WALLPAPERS = [
            "01壁纸1.jpg",
            "01壁纸2.jpg",
            "01壁纸3.jpg",
            "01壁纸4.jpg",
            "01壁纸5.jpg"
        ];

        // ==================== 2. 全局变量与节点获取 ====================
        const audioPlayer = new Audio(TOUCH_SOUND_URL);
        audioPlayer.preload = "auto"; 

        const phoneWallpaper = document.getElementById('phoneWallpaper');
        const statusBarTime = document.getElementById('statusBarTime');
        const appItems = document.querySelectorAll('.app-item');

        // ==================== 3. 5张壁纸刷新自动循环算法 ====================
        function initLoopWallpaper() {
            let currentIndex = localStorage.getItem('wallpaperIndex');
            if (currentIndex === null) {
                currentIndex = 0;
            } else {
                currentIndex = (parseInt(currentIndex, 10) + 1) % WALLPAPERS.length;
            }
            phoneWallpaper.style.backgroundImage = "url('" + WALLPAPERS[currentIndex] + "')";
            localStorage.setItem('wallpaperIndex', currentIndex);
        }
        initLoopWallpaper();

        // ==================== 4. 同步系统时间 ====================
        function syncTime() {
            const now = new Date();
            let hrs = now.getHours().toString().padStart(2, '0');
            let mins = now.getMinutes().toString().padStart(2, '0');
            statusBarTime.textContent = hrs + ":" + mins;
        }
        syncTime();
        setInterval(syncTime, 1000);

        // ==================== 5. 🔴 饱满音效延时跳转算法 ====================
        function playTouchSound() {
            const soundInstance = audioPlayer.cloneNode();
            soundInstance.volume = 0.3; 
            soundInstance.play().catch(function(e) {
                console.log("互动激活音频");
            });
        }

        appItems.forEach(function(app) {
            app.addEventListener('click', function(event) {
                // 1. 🔴 抢先拦截默认的瞬间跳转，给声音播放争取宝贵时间
                event.preventDefault(); 
                
                // 2. 🔴 立刻发出清脆的触摸屏音效
                playTouchSound();
                
                const targetUrl = app.getAttribute('href');
                
                // 3. 判断是否是无效占位链接或空链接
                if (targetUrl === '#' || targetUrl.trim() === '' || targetUrl.includes('javascript:void(0)')) {
                    console.log("无效点击占位，已完美留在原地并发出完整音效: " + app.getAttribute('data-name'));
                    return; 
                }
                
                // 4. 🔴 核心机制：故意延长 220 毫秒，等耳朵听到饱满的点击声音后，脚本才会强制执行链接打开！
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 220); 
            });
        });
    </script>
