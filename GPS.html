<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云台高精控制系统</title>
    <style>
        /* 1. 全局初始化与无痕视口 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #05070f; color: #fff; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* 全局全屏容器 - 确保底层地图能全屏铺满 */
        .stage-viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .main-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; gap: 30px; z-index: 10; transition: opacity 0.5s ease; }
        
        /* 2. 预加载层（Loading Animation）样式 */
        .loader-mask { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #05070f; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1); will-change: opacity; }
        .loader-mask.fade-out { opacity: 0; pointer-events: none; }
        .radar-box { position: relative; width: 80px; height: 80px; border: 2px dashed #00f2fe; border-radius: 50%; animation: spinRadar 2s linear infinite; }
        .radar-box::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: conic-gradient(from 0deg, rgba(0,242,254,0.4) 0%, rgba(0,242,254,0) 60%); border-radius: 50%; }
        @keyframes spinRadar { 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: #00f2fe; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        .progress-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #00f2fe; box-shadow: 0 0 8px #00f2fe; transition: width 0.1s linear; }
        /* 3. 自适应机械大光圈 - 开启独立显卡渲染跑道 */
        .iris-stage { position: relative; width: 280px; height: 280px; border-radius: 50%; border: 3px solid #1e293b; background-color: #121929; box-shadow: 0 0 35px rgba(0, 242, 254, 0.2); transform: translate3d(0,0,0); transition: all 0.9s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform, border-radius, border, box-shadow; z-index: 5; }
        @media (min-width: 768px) { .iris-stage { width: 440px; height: 440px; } }
        @media (min-width: 1024px) { .iris-stage { width: 520px; height: 520px; } }

        /* 密码正确后，光圈容器直接全屏化铺满，打破圆圈边界限制 */
        .iris-stage.fullscreen-map { width: 100vw !important; height: 100vh !important; border-radius: 0% !important; border-color: transparent !important; box-shadow: none !important; }

        /* 4. 机械快门光圈控制层（由于父容器变全屏，它放大4倍彻底淡出） */
        .iris-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 6; transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease; transform-origin: center center; will-change: transform, opacity; }
        .iris-wrapper.open { transform: scale3d(4, 4, 1) rotate(85deg); opacity: 0; pointer-events: none; }
        
        /* 渐变错位金属叶片组 */
        .iris-blade { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(145deg, #1e293b 0%, #0f172a 40%, #020617 80%); border-left: 2px solid #334155; border-bottom: 1px solid #1e293b; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); transform-origin: 20% 30%; }
        .blade-1 { transform: rotate(0deg) translate3d(5%, 15%, 0); } .blade-2 { transform: rotate(60deg) translate3d(5%, 15%, 0); } .blade-3 { transform: rotate(120deg) translate3d(5%, 15%, 0); }
        .blade-4 { transform: rotate(180deg) translate3d(5%, 15%, 0); } .blade-5 { transform: rotate(240deg) translate3d(5%, 15%, 0); } .blade-6 { transform: rotate(300deg) translate3d(5%, 15%, 0); }

        /* 居中大Logo水印 */
        .logo-watermark { position: absolute; top: 50%; left: 50%; transform: translate3d(-50%, -50%, 0); z-index: 10; pointer-events: none; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .main-logo { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0.85; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7)); }
        /* 5. 高精地图全屏层与红点标记 */
        .map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transform: scale3d(1.05, 1.05, 1); transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }
        .iris-stage.fullscreen-map .map-container { transform: scale3d(1, 1, 1); }
        .map-base { width: 100%; height: 100%; object-fit: cover; }
        
        /* 地图中间偏右红点 */
        .red-marker { position: absolute; top: 48%; left: 62%; width: 18px; height: 18px; background-color: #ff3b30; border-radius: 50%; cursor: pointer; animation: pulseMarker 1.5s infinite; z-index: 3; }
        @keyframes pulseMarker { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.8); } 70% { box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); } }

        /* 6. 输入控制区域（复合层缓动） */
        .input-section { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; z-index: 12; transition: opacity 0.4s ease, transform 0.4s ease; will-change: opacity, transform; }
        .input-section.hide { opacity: 0; transform: scale3d(0.95, 0.95, 1); pointer-events: none; }
        .input-group { display: flex; width: 100%; }
        .input-group input { flex: 1; background: #111827; border: 1px solid #1f2937; padding: 12px; color: #fff; border-radius: 4px 0 0 4px; outline: none; }
        .input-group input:focus { border-color: #00f2fe; }
        .input-group button { background: #00f2fe; border: none; padding: 0 20px; font-weight: bold; border-radius: 0 4px 4px 0; cursor: pointer; color: #0b0f19; }
        .error-tip { color: #ff3b30; font-size: 13px; display: none; margin-top: 2px; }
        
        /* 【已修复】：显眼位置的大返回键（改为常驻状态，并在进入全屏时改变内部文字内容） */
        .global-back-btn { position: absolute; top: 25px; left: 25px; z-index: 99; background: #ff3b30; border: none; color: #fff; padding: 10px 22px; font-weight: bold; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 14px rgba(255, 59, 48, 0.4); transition: background 0.3s; }
        .global-back-btn:hover { background: #e02e24; }

        /* 7. 信息框弹窗 */
        .custom-modal-mask { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3, 7, 18, 0.85); z-index: 200; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .custom-modal-mask.active { opacity: 1; pointer-events: auto; }
        .custom-modal { background: #111827; border: 1px solid #1e293b; border-radius: 8px; width: 88%; max-width: 480px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 16px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .modal-close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; max-height: 55vh; overflow-y: auto; }
        @media (min-width: 600px) { .modal-body { flex-direction: row; } .modal-gallery { width: 40%; } .modal-text { width: 60%; } }
        .modal-thumb { width: 100%; height: auto; border-radius: 4px; object-fit: cover; }
        .modal-footer { padding: 12px 16px; border-top: 1px solid #1e293b; display: flex; justify-content: flex-end; }
        .modal-back-btn { background: #1f2937; border: 1px solid #374151; color: #d1d5db; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 预加载动画动画层 -->
    <div class="loader-mask" id="loaderMask">
        <div class="radar-box"></div>
        <div class="loading-text" id="loadingText">正在加载高精地图数据 0%</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- 网页核心物理世界视口 -->
    <div class="stage-viewport">
        <!-- 【已常驻】：页面左上角显眼的返回键，初始显示“返回系统” --> 
        <button class="global-back-btn" id="globalBackBtn">返回系统</button>

        <div class="main-container" id="mainContent" style="opacity: 0;">
            <!-- 核心图像容器层 -->
            <div class="iris-stage" id="irisStage">
                <!-- 全屏底图展示层 -->
                <div class="map-container">
                    <!-- 【改这里】：更换你的高精地图背景图片路径 -->
                    <img src="卫星地图.jpg" alt="高精地图" class="map-base">
                    <!-- 地图中间偏右红点标记 -->
                    <div class="red-marker" id="redMarker"></div>
                </div>

                <!-- 极速抗卡顿机械光圈构件 -->
                <div class="iris-wrapper" id="irisWrapper">
                    <div class="iris-blade blade-1"></div><div class="iris-blade blade-2"></div><div class="iris-blade blade-3"></div>
                    <div class="iris-blade blade-4"></div><div class="iris-blade blade-5"></div><div class="iris-blade blade-6"></div>
                    
                    <!-- 中心叠加的大水印Logo -->
                    <div class="logo-watermark">
                        <!-- 【改这里】：更换你的大 Logo 贴图路径 -->
                        <img src="FANS-LOGO.png" alt="系统Logo" class="main-logo">
                    </div>
                </div>
            </div>

            <!-- 数据输入验证交互层 -->
            <div class="input-section" id="inputSection">
                <label style="font-size: 14px; color: #00f2fe; font-weight: bold; letter-spacing: 1px;">GPS 编码</label>
                <div class="input-group">
                    <input type="text" id="gpsInput" placeholder="请输入正确的GPS编码...">
                    <button id="submitBtn">确认</button>
                </div>
                <p class="error-tip" id="errorTip">安全密码校验失败，请重试</p>
            </div>
        </div>
    </div>

    <!-- 图文自定义信息弹窗 --> 
    <div class="custom-modal-mask" id="customModal">
        <div class="custom-modal">
            <div class="modal-header">
                <span style="color: #00f2fe; font-weight: bold;">GPS最后采集信息：</span>
                <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-gallery">
                    <!-- 【改这里】：信息弹窗内的缩略图路径 -->
                    <img src="S赖小花.jpg" alt="详细数据图" class="modal-thumb">
                </div>
                <div class="modal-text">
                    <p style="color: #94a3b8; font-size: 14px; line-height: 1.5;">GPS定位信息（已实名登记）</p>
                    <p style="color: #94a3b8; font-size: 14px; line-height: 1.5;">姓名：赖小花</p>
                    <p style="color: #94a3b8; font-size: 14px; line-height: 1.5;">纬度：112°26′14.82″N</p>
                    <p style="color: #94a3b8; font-size: 14px; line-height: 1.5;">经度：241°08′33.67″E</p>
                    <p style="color: #94a3b8; font-size: 14px; line-height: 1.5;">地址：纳兰街48号</p>
                    <p style="color: #94a3b8; font-size: 14px; line-height: 1.5;">海拔：‑4.3米</p>
                    <p style="color: #94a3b8; font-size: 14px; line-height: 1.5;">移动速度：0km/h</p>
                
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-back-btn" id="modalBackBtn">返回地图</button>
            </div>
        </div>
    </div>
    <script>
        //  
        const CORRECT_CODE = "57579"; 

        const loaderMask = document.getElementById('loaderMask');
        const progressFill = document.getElementById('progressFill');
        const loadingText = document.getElementById('loadingText');
        const mainContent = document.getElementById('mainContent');

        const gpsInput = document.getElementById('gpsInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorTip = document.getElementById('errorTip');
        const irisStage = document.getElementById('irisStage');
        const irisWrapper = document.getElementById('irisWrapper');
        const inputSection = document.getElementById('inputSection');
        const globalBackBtn = document.getElementById('globalBackBtn');
        const redMarker = document.getElementById('redMarker');
        const customModal = document.getElementById('customModal');

        let isAnimating = false;
        let isAtFullscreenMap = false; // 状态锁：判断当前是在首页还是全屏地图

        // ==========================================
        // 1. 模拟高精地图文件流加载动画逻辑
        // ==========================================
        let count = 0;
        const loadTimer = setInterval(() => {
            count += Math.floor(Math.random() * 8) + 2;
            if (count >= 100) {
                count = 100;
                clearInterval(loadTimer);
                setTimeout(() => {
                    loaderMask.classList.add('fade-out');
                    mainContent.style.opacity = '1';
                }, 400);
            }
            progressFill.style.width = count + '%';
            loadingText.innerText = `正在空对地校准数据中... ${count}%`;
        }, 80);

        // ==========================================
        // 2. 校验并展开至全屏幕大地图视角
        // ==========================================
        function verifyAndOpen() {
            if (isAnimating) return;
            if (gpsInput.value.trim() === CORRECT_CODE) {
                isAnimating = true;
                errorTip.style.display = 'none';
                
                // 光圈扩大淡出 + 舞台打破边缘限制膨胀全屏
                irisWrapper.classList.add('open');
                irisStage.classList.add('fullscreen-map');
                
                // 隐藏输入面板
                inputSection.classList.add('hide');
                
                // 切换按钮文字状态
                globalBackBtn.innerText = "返回控制台";
                isAtFullscreenMap = true;
                
                setTimeout(() => { isAnimating = false; }, 900);
            } else {
                errorTip.style.display = 'block';
                gpsInput.style.borderColor = '#ff3b30';
            }
        }

        submitBtn.addEventListener('click', verifyAndOpen);
        gpsInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyAndOpen(); });

        // ==========================================
        // 3. 双模返回按键点击逻辑
        // ==========================================
        // ==========================================
        // 3. 双模返回按键点击逻辑（已去掉提示，直接跳转）
        // ==========================================
        globalBackBtn.addEventListener('click', () => {
            if (isAnimating) return;

            if (isAtFullscreenMap) {
                // 情景 A：如果在全屏大地图状态，点击返回恢复到首页输入光圈 安全密码："989148""98888""989888""989788"
                isAnimating = true;
                inputSection.classList.remove('hide');
                irisStage.classList.remove('fullscreen-map');
                irisWrapper.classList.remove('open');
                
                gpsInput.value = '';
                gpsInput.style.borderColor = '#1f2937';
                globalBackBtn.innerText = "返回系统";
                isAtFullscreenMap = false;
                setTimeout(() => { isAnimating = false; }, 900);
            } else {
                // 情景 B：如果在首页状态，直接静默跳转，没有任何弹窗提示
                
                // 【改这里】：把下面的网址换成您真正需要跳转的页面地址
                window.location.href = "J空间站.html"; 
            }
        });


        // 4. 信息面板交互流
        redMarker.addEventListener('click', () => customModal.classList.add('active'));
        const closeM = () => customModal.classList.remove('active');
        document.getElementById('modalCloseBtn').addEventListener('click', closeM);
        document.getElementById('modalBackBtn').addEventListener('click', closeM);
        customModal.addEventListener('click', (e) => { if (e.target === customModal) closeM(); });
    </script>
</body>
</html>
